model:
  vocab_size: 8192
  context_length: 512
  d_model: 256
  n_layers: 6
  n_heads: 8
  ff_dim: 1024
  position_encoding: rope
  dropout: 0.0
data:
  train: [data/pretrain, data/chat/chat.jsonl]
  validation: [data/val]
  tokenizer: tokenizer.json
  sequence_length: 512
  text_field: text
training:
  max_tokens: 150000000
  micro_batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 200
  decay: cosine
  weight_decay: 0.1
  gradient_clip: 1.0
  precision: fp32
checkpoint:
  directory: checkpoints
  interval_steps: 500
  keep_last: 3
evaluation:
  interval_steps: 500