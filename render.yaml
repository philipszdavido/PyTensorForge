services:
  - type: web
    name: ptf-gpt
    runtime: docker
    plan: starter            # a persistent disk needs a paid plan; pick more RAM for bigger models
    healthCheckPath: /health
    envVars:
      - key: PTF_API_KEYS
        generateValue: true  # Render generates a random key; read it in the dashboard
      - key: MODEL_URL
        sync: false          # you are prompted for this: https URL of your model .tar.gz
      - key: MODEL_SHA256
        sync: false          # optional integrity check (leave empty to skip)
      - key: MODEL_DIR
        value: /data/model
    disk:
      name: model-data
      mountPath: /data
      sizeGB: 2
