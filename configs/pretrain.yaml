model:
  vocab_size: 8192
  context_length: 256
  d_model: 256
  n_layers: 6
  n_heads: 8
  ff_dim: 1024
  position_encoding: rope
data:
  train: [data/pretrain]
  val_split_fraction: 0.01
  tokenizer: tokenizer.json
  sequence_length: 256
  prefetch: 4
training:
  total_steps: 20000
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.0006
  warmup_steps: 500
  decay: cosine
  activation_checkpointing: false
checkpoint:
  directory: checkpoints
  interval_steps: 500
  keep_last: 3
evaluation:
  interval_steps: 500
  max_batches: 50
runtime:
  device: cuda
