# Stage 2: turn the pretrained model into a chat model.
# The model: section must match pretrain.yaml exactly.
model:
  vocab_size: 8192
  context_length: 256
  d_model: 256
  n_layers: 6
  n_heads: 8
  ff_dim: 1024
  position_encoding: rope
data:
  train: [data/chat/train]
  validation: [data/chat/val.jsonl]
  tokenizer: tokenizer.json
  format: chat
  chat_template: ptf-chat
  chat_packing: pack
  sequence_length: 256
  prefetch: 0
training:
  init_from: checkpoints/checkpoint_latest.ptf
  total_steps: 3000
  micro_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  warmup_steps: 50
  decay: cosine
checkpoint:
  directory: checkpoints-chat
  interval_steps: 250
  keep_last: 3
evaluation:
  interval_steps: 250
  max_batches: 25
