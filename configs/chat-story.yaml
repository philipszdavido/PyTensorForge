model:
  vocab_size: 8192
  context_length: 256
  d_model: 256
  n_layers: 6
  n_heads: 8
  ff_dim: 1024
  position_encoding: rope
data:
  train: [data/chat-story/train]
  validation: [data/chat-story/val.jsonl]
  tokenizer: tokenizer.json
  format: chat
  chat_template: ptf-chat
  chat_packing: pad
  sequence_length: 256
  prefetch: 0
training:
  init_from: checkpoints/checkpoint_latest.ptf
  total_steps: 800
  micro_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 0.00005
  warmup_steps: 30
  decay: cosine
checkpoint:
  directory: checkpoints-story
  interval_steps: 200
  keep_last: 3
evaluation:
  interval_steps: 200
  max_batches: 25
runtime:
  device: mps
